auth_enabled: false
server:
  http_listen_port: 3100
  log_level: info
common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki2
schema_config:
  configs:
    - from: 2025-01-01
      index:
        period: 24h
        prefix: index_
      store: tsdb
      object_store: filesystem
      schema: v13
storage_config:
  tsdb_shipper:
    active_index_directory: /loki2/tsdb-index
    cache_location: /loki2/tsdb-cache
  filesystem:
    directory: /loki2/chunks
compactor:
  working_directory: /loki2/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
limits_config:
  retention_period: 720h
  max_entries_limit_per_query: 9999999999
