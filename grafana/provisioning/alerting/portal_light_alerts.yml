apiVersion: 1

groups:
  - orgId: 1
    name: portal_lights_alerts
    folder: Portal Lights
    interval: 1m
    rules:
      - uid: portal_lights_dropped
        title: Portal Lights Count Dropped
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: portal_lights_up_ratio{project_uuid=~".*"}
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200

          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: portal_lights_up_ratio{project_uuid=~".*"} offset 1m
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200

          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: $A < $B
              refId: C

        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Portal lights count dropped for {{ $labels.project_uuid }}
          description: |
            Current count: {{ $values.A.Value }}
            Previous count: {{ $values.B.Value }}
            Project: {{ $labels.project_uuid }}
        labels:
          severity: warning
          team: backend