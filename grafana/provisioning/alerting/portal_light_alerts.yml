apiVersion: 1

groups:
  - orgId: 1
    name: portal_lights_alerts
    folder: Portal Lights
    interval: 1m
    rules:
      - uid: portal_lights_dropped
        title: Portal Lights Count Dropped
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafana_prometheus 
            model:
              expr: portal_lights_up{project_uuid=~".*"}
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200

          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: grafana_prometheus
            model:
              expr: max_over_time(portal_lights_up{project_uuid=~".*"}[5m])
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200

          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: $A < $B
              refId: C

        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Portal lights count dropped for {{ $labels.project_uuid }}
          description: |
            Current count: {{ $values.A.Value }}
            Expected (5m max): {{ $values.B.Value }}
            Project: {{ $labels.project_uuid }}
        labels:
          severity: warning
          team: backend